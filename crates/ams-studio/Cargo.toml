[package]
name = "ams-studio"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ams-core = { version = "0.3.2", path = "../ams-core" }
calamine = "0.38.0"
cfb = "0.16.0"
chrono = { version = "0.4.41", default-features = false, features = ["clock", "std"] }
earcutr = "0.5.0"
eframe = "0.37.0"
egui = "0.37"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "tiff"] }
rfd = "0.18.0"
roxmltree = "0.21"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde_json = "1.0.154"
tiff = { version = "0.11.3", default-features = false }
ureq = "3"
sha2 = "0.10"
zip = { version = "9", default-features = false, features = ["deflate"] }

[build-dependencies]
embed-resource = "3"
